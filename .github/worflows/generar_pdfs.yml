name: Actualizar PDFs de Fichas Estatales

# El proceso se disparará automáticamente cuando subas cambios a la rama principal
# o modifiques los datos.
on:
  push:
    branches:
      - main
    paths:
      - 'data/**'          # Solo corre si actualizas la carpeta de datos
      - 'app.py'           # O si modificas el código del intermediario
      - 'ficha*.py'        # Corre si modificas ficha.py, ficha_v2.py, ficha_v3.py, etc.
  workflow_dispatch:       # Te permite correrlo manualmente desde GitHub si lo deseas

jobs:
  generar-pdfs:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalar dependencias del Dashboard y Playwright
        run: |
          python -m pip install --upgrade pip
          # Instala las librerías de tu app desde tu archivo y Playwright en la nube
          pip install -r requirements.txt playwright
          # Instala los navegadores de Playwright
          playwright install chromium --with-deps

      - name: Levantar Streamlit en segundo plano
        run: |
          # Corre tu app en el puerto 8501 y lo manda a segundo plano
          streamlit run app.py --server.port 8501 --server.headless true &
          
          # Espera unos segundos para asegurar que el servidor levantó
          sleep 10 

      - name: Ejecutar script de generación masiva
        run: |
          # Ejecuta tu script actual que crea el ZIP
          python generar_pdf.py

      - name: Hacer Commit y Push del nuevo ZIP
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add fichas_pdf.zip
          
          # Solo hace commit si hay cambios reales en el ZIP
          git commit -m "🤖 Auto-actualización de PDFs por cambios en datos" || echo "No hay cambios para hacer commit"
          git push